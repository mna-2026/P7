name: Test & deploy model

on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'
            - name: Install dependencies
              run: |
                python -m venv venv
                source venv/bin/activate
                pip install -r api/requirements.txt
            - name: Run Tests
              run: |
                source venv/bin/activate
                cd api
                pytest
            - name: Build image
              run: |
                docker build -t scoring-model-api .
                ls
